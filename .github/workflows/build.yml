name: Deterministic Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compliance:
    name: Compliance & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci
          cd angular-ui && npm ci --legacy-peer-deps

      - name: Linting
        run: npm run lint

      - name: Dependency Audit (Root)
        run: npm audit --audit-level=critical --omit=dev

      - name: Dependency Audit (Frontend)
        working-directory: angular-ui
        run: npm audit --audit-level=critical --omit=dev

  backend-verification:
    name: Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend
        run: npm ci

      - name: Run Tests
        run: npm test

  frontend-verification:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Frontend
        working-directory: angular-ui
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        working-directory: angular-ui
        run: npm run test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build Distribution
        working-directory: angular-ui
        run: npm run build

      - name: Archive Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: angular-ui/dist/
          retention-days: 5

  docker-build:
    name: Docker Build Verification
    needs: [backend-verification, frontend-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # We rebuild context here to ensure the Dockerfile is self-contained and works from source.
      # Alternatively, we could download the frontend-dist artifact and COPY it in,
      # but standard Docker builds usually start from source for reproducibility.
      # Given the prompt asks for "Deterministic Build", building from source inside Docker is safest
      # as it isolates the build environment completely.

      - name: Build Docker Image
        run: docker build . -t app:latest

      - name: Export Docker Image
        run: docker save app:latest | gzip > app-latest.tar.gz

      - name: Archive Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: app-latest.tar.gz
          retention-days: 1
